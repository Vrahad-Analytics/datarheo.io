services:
  frontend:
    image: datarheo-io-homepage-frontend:latest
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: datarheo-io-homepage-backend:latest
    build:
      context: ./Backend
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/datarheo
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret-1234}
      FRONTEND_URL: http://localhost
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
  caddy-data:
  caddy-config: