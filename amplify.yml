version: 1
frontend:
  phases:
    preBuild:
      commands:
        - (cd Frontend && npm ci --no-audit --no-fund)
    build:
      commands:
        - (cd Frontend && npm run build)
  artifacts:
    baseDirectory: Frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - Frontend/node_modules/**/*