version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Vite emits the built site here. Serving the repo root instead is what
    # produces a blank page: the source index.html points at /src/main.jsx,
    # which only exists during development.
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
